    const AI_ENDPOINT_STORAGE = 'editor_ai_endpoint';
    const AI_MODELS_CACHE = 'editor_ai_models_cache';
    const DEFAULT_ENDPOINT = 'https://api.openai.com/v1';

    function loadAiEndpoint() {
        try { return localStorage.getItem(AI_ENDPOINT_STORAGE) || ''; } catch (e) { return ''; }
    }

    function saveAiEndpoint(endpoint) {
        try { localStorage.setItem(AI_ENDPOINT_STORAGE, endpoint); } catch (e) {}
    }

    function loadAiKey() {
        try { return localStorage.getItem(AI_KEY_STORAGE) || ''; } catch (e) { return ''; }
    }

    function saveAiKey(key) {
        try { localStorage.setItem(AI_KEY_STORAGE, key); } catch (e) {}
        updateAiStatus();
    }

    function loadAiModel() {
        try { return localStorage.getItem(AI_MODEL_STORAGE) || ''; } catch (e) { return ''; }
    }

    function saveAiModel(model) {
        try { localStorage.setItem(AI_MODEL_STORAGE, model); } catch (e) {}
    }

    function loadModelsCache() {
        try {
            const raw = localStorage.getItem(AI_MODELS_CACHE);
            return raw ? JSON.parse(raw) : null;
        } catch (e) { return null; }
    }

    function saveModelsCache(endpoint, models) {
        try {
            localStorage.setItem(AI_MODELS_CACHE, JSON.stringify({ endpoint: endpoint, models: models, ts: Date.now() }));
        } catch (e) {}
    }

    function getEndpointChatUrl(endpoint) {
        let url = (endpoint || DEFAULT_ENDPOINT).replace(/\/+$/, '');
        // Auto-append /chat/completions if the endpoint is a base URL
        if (!/\/chat\/completions$/.test(url)) {
            url += '/chat/completions';
        }
        return url;
    }

    function getEndpointModelsUrl(endpoint) {
        let url = (endpoint || DEFAULT_ENDPOINT).replace(/\/+$/, '');
        return url + '/models';
    }

    function updateAiStatus() {
        const hasKey = aiKeyInput.value.trim().length > 0;
        btnAiSend.disabled = !hasKey;
        aiStatusDot.title = hasKey ? 'API Key 已配置' : '未配置 API Key';
        aiStatusDot.classList.toggle('ready', hasKey);
        aiStatusDot.classList.toggle('loading', false);
    }

    function populateModelSelect(models, currentModel) {
        aiModelSelect.innerHTML = '';
        if (!models || models.length === 0) {
            // Fallback models
            const fallbacks = ['gpt-4o', 'gpt-4o-mini', 'gpt-4-turbo', 'claude-3-5-sonnet-20241022'];
            fallbacks.forEach(m => {
                const opt = document.createElement('option');
                opt.value = m;
                opt.textContent = m;
                aiModelSelect.appendChild(opt);
            });
        } else {
            // Filter out non-chat models and sort
            const chatModels = models.filter(m => {
                const id = (m.id || '').toLowerCase();
                // Exclude embedding, moderation, tts, whisper, dall-e, etc.
                const exclude = ['embedding', 'moderation', 'tts-', 'whisper', 'dall-e', 'dalle', 'babbage', 'davinci', 'text-'];
                return !exclude.some(prefix => id.includes(prefix));
            });
            chatModels.sort((a, b) => (a.id || '').localeCompare(b.id || ''));
            chatModels.forEach(m => {
                const opt = document.createElement('option');
                opt.value = m.id;
                opt.textContent = m.id;
                aiModelSelect.appendChild(opt);
            });
        }
        // Restore saved model if it exists in the list
        if (currentModel) {
            const match = [...aiModelSelect.options].find(o => o.value === currentModel);
            if (match) {
                aiModelSelect.value = currentModel;
            } else if (aiModelSelect.options.length > 0) {
                aiModelSelect.value = aiModelSelect.options[0].value;
                saveAiModel(aiModelSelect.value);
            }
        } else if (aiModelSelect.options.length > 0) {
            aiModelSelect.value = aiModelSelect.options[0].value;
        }
    }

    async function fetchModels() {
        const endpoint = aiEndpointInput.value.trim();
        const apiKey = loadAiKey();
        if (!apiKey) {
            showToast('请先输入 API Key', '');
            return;
        }

        const modelsUrl = getEndpointModelsUrl(endpoint);
        btnRefreshModels.classList.add('spinning');
        btnRefreshModels.disabled = true;

        try {
            const res = await fetch(modelsUrl, {
                headers: {
                    'Authorization': 'Bearer ' + apiKey,
                    'Content-Type': 'application/json'
                }
            });

            if (!res.ok) {
                const errBody = await res.text().catch(() => '');
                let errMsg = '获取模型列表失败';
                if (res.status === 401) errMsg = 'API Key 无效';
                else if (res.status === 404) errMsg = '端点不支持 /models 接口';
                throw new Error(errMsg + (errBody ? ': ' + errBody.slice(0, 150) : ''));
            }

            const data = await res.json();
            const models = data.data || [];
            if (models.length === 0) {
                showToast('未获取到模型列表', '');
                return;
            }

            const currentModel = loadAiModel();
            populateModelSelect(models, currentModel);
            saveModelsCache(endpoint, models);
            showToast('已加载 ' + models.length + ' 个模型', '');
        } catch (err) {
            showToast(err.message || '获取模型失败', '');
        } finally {
            btnRefreshModels.classList.remove('spinning');
            btnRefreshModels.disabled = false;
        }
    }

    // Fetch models on endpoint blur if key is set
    aiEndpointInput.addEventListener('blur', () => {
        const endpoint = aiEndpointInput.value.trim();
        saveAiEndpoint(endpoint);
        const cached = loadModelsCache();
        // Auto-fetch if endpoint changed and key is set
        if (endpoint && loadAiKey() && (!cached || cached.endpoint !== endpoint)) {
            fetchModels();
        }
    });

    function addChatMessage(role, text) {
        const msg = document.createElement('div');
        msg.className = 'ai-message ' + role;
        msg.textContent = text;
        aiChatArea.appendChild(msg);
        aiChatArea.scrollTop = aiChatArea.scrollHeight;
        return msg;
    }

    function addTypingIndicator() {
        const ind = document.createElement('div');
        ind.className = 'ai-typing-indicator';
        ind.id = 'aiTypingIndicator';
        for (let i = 0; i < 3; i++) {
            const dot = document.createElement('span');
            dot.className = 'ai-typing-dot';
            ind.appendChild(dot);
        }
        aiChatArea.appendChild(ind);
        aiChatArea.scrollTop = aiChatArea.scrollHeight;
    }

    function removeTypingIndicator() {
        const ind = document.getElementById('aiTypingIndicator');
        if (ind) ind.remove();
    }

    function hideAiEmptyState() {
        const empty = document.getElementById('aiEmptyState');
        if (empty) empty.style.display = 'none';
    }

    // AI API Key 输入事件
    aiKeyInput.addEventListener('input', () => {
        saveAiKey(aiKeyInput.value.trim());
    });
    aiKeyInput.addEventListener('blur', () => {
        const key = aiKeyInput.value.trim();
        saveAiKey(key);
        if (key && aiKeyInput.type === 'password') {
            aiKeyInput.value = key.slice(0, 10) + '••••' + key.slice(-4);
        }
    });
    aiKeyInput.addEventListener('focus', () => {
        const key = loadAiKey();
        aiKeyInput.value = key;
        aiKeyInput.type = 'text';
    });

    aiModelSelect.addEventListener('change', () => {
        saveAiModel(aiModelSelect.value);
    });

    btnRefreshModels.addEventListener('click', () => fetchModels());

    // AI 发送按钮
    btnAiSend.addEventListener('click', async () => {
        const instruction = aiChatInput.value.trim();
        if (!instruction) return;
        const apiKey = loadAiKey();
        if (!apiKey) {
            showToast('请先设置 API Key', '');
            return;
        }

        hideAiEmptyState();
        addChatMessage('user', instruction);
        aiChatInput.value = '';
        aiChatInput.disabled = true;
        btnAiSend.disabled = true;
        aiStatusDot.classList.add('loading');
        addTypingIndicator();

        try {
            const response = await callAiApi(apiKey, aiModelSelect.value, instruction);
            removeTypingIndicator();
            const msg = addChatMessage('assistant', response.text || '完成');
            if (response.code) {
                addDiffCard(msg, response.code);
            }
        } catch (err) {
            removeTypingIndicator();
            const errorMsg = err.message || 'AI 请求失败，请检查 API Key 和网络';
            addChatMessage('assistant', 'Error: ' + errorMsg);
        } finally {
            aiChatInput.disabled = false;
            btnAiSend.disabled = false;
            aiStatusDot.classList.remove('loading');
            updateAiStatus();
        }
    });

    aiChatInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            btnAiSend.click();
        }
    });

    // ==================== AI API 调用 ====================
    async function callAiApi(apiKey, model, instruction) {
        const currentCode = getCode();
        const systemPrompt = `你是一个代码编辑助手，工作在 HTML/CSS/JS 实时预览编辑器里。
用户的代码是一个完整的单文件 HTML 页面，其中包含 CSS 在 <style> 标签、JS 在 <script> 标签。

你的任务：根据用户的指令修改代码，只返回修改后的完整 HTML 代码。
规则：
1. 只返回代码，用 \`\`\`html ... \`\`\` 代码块包裹
2. 不要添加额外的解释，不要把代码块外写说明
3. 保持原有代码结构和缩进风格
4. 如果用户指令跟代码修改无关，回复 "NOT_CODE_TASK"
5. 不要修改用户没提到的部分`;

        const messages = [
            { role: 'system', content: systemPrompt },
            { role: 'user', content: `当前代码：
\`\`\`html
${currentCode}
\`\`\`

指令：${instruction}` }
        ];

        const endpoint = loadAiEndpoint();
        const chatUrl = getEndpointChatUrl(endpoint);

        const res = await fetch(chatUrl, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'Authorization': 'Bearer ' + apiKey
            },
            body: JSON.stringify({
                model: model,
                messages: messages,
                max_tokens: 16384,
                temperature: 0.1
            })
        });

        if (!res.ok) {
            const errBody = await res.text().catch(() => '');
            let errMsg = 'API 错误 ' + res.status;
            if (res.status === 401) errMsg = 'API Key 无效，请检查';
            else if (res.status === 429) errMsg = '请求过于频繁，请稍后再试';
            else if (res.status === 403) errMsg = 'API Key 没有访问权限';
            throw new Error(errMsg + (errBody ? ': ' + errBody.slice(0, 200) : ''));
        }

        const data = await res.json();
        const aiText = data.choices?.[0]?.message?.content || '';

        if (aiText.includes('NOT_CODE_TASK')) {
            return { text: '请描述代码修改需求，我可以帮你调整样式、布局、功能等。', code: null };
        }

        // Extract code from markdown block
        const codeMatch = aiText.match(/```html\s*\n?([\s\S]*?)```/);
        const extractedCode = codeMatch ? codeMatch[1].trim() : aiText.trim();

        // Build a simple diff summary
        const diffSummary = buildDiffSummary(currentCode, extractedCode);

        return {
            text: diffSummary || '代码已修改',
            code: extractedCode
        };
    }

    function buildDiffSummary(original, modified) {
        const oldLines = original.split('\n');
        const newLines = modified.split('\n');
        const added = newLines.length - oldLines.length;
        const changed = newLines.filter((l, i) => l !== oldLines[i] && i < oldLines.length).length;
        const parts = [];
        if (added > 0) parts.push('新增 ' + added + ' 行');
        else if (added < 0) parts.push('删除 ' + Math.abs(added) + ' 行');
        if (changed > 0 && changed !== Math.abs(added)) parts.push('修改 ' + changed + ' 行');
        return parts.length ? parts.join('，') : '代码已修改';
    }

    function addDiffCard(messageEl, code) {
        const card = document.createElement('div');
        card.className = 'ai-diff-card';
        card.innerHTML = `
            <div class="ai-diff-header">
                <span>修改后的代码</span>
                <span>${code.split('\n').length} 行</span>
            </div>
            <div class="ai-diff-code">${escapeHtml(code.slice(0, 1500))}${code.length > 1500 ? '\n…（已截断）' : ''}</div>
            <div class="ai-diff-actions">
                <button class="btn btn-accent btn-apply-ai-code">应用到编辑器</button>
                <button class="btn btn-copy-ai-code">复制代码</button>
            </div>
        `;

        card.querySelector('.btn-apply-ai-code').addEventListener('click', () => {
            setCode(code);
            updatePreview();
            showToast('代码已应用到编辑器', '');
        });

        card.querySelector('.btn-copy-ai-code').addEventListener('click', () => {
            navigator.clipboard.writeText(code).then(() => {
                showToast('代码已复制', '');
            }).catch(() => {
                showToast('复制失败', '');
            });
        });

        messageEl.appendChild(card);
        aiChatArea.scrollTop = aiChatArea.scrollHeight;
    }

    function escapeHtml(str) {
        return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    function initAiPanel() {
        // Load endpoint
        const endpoint = loadAiEndpoint();
        if (endpoint) {
            aiEndpointInput.value = endpoint;
        }

        // Load key (masked)
        const key = loadAiKey();
        if (key) {
            aiKeyInput.value = key.slice(0, 10) + '••••' + key.slice(-4);
        }

        // Load models (from cache or fallback)
        const cached = loadModelsCache();
        const currentModel = loadAiModel();
        if (cached && cached.models && cached.models.length > 0) {
            populateModelSelect(cached.models, currentModel);
        } else {
            populateModelSelect(null, currentModel);
        }

        // Auto-fetch if we have both endpoint and key but no cache
        if (endpoint && key && (!cached || !cached.models || cached.models.length === 0)) {
            // Delay fetch to not block page load
            setTimeout(() => fetchModels(), 500);
        }

        updateAiStatus();
    }

    function initSnippets() {
        loadSnippetsFromStorage();
        renderSnippetsList();

        snippetsList.addEventListener('click', (e) => {
            const card = e.target.closest('.snippet-card');
            if (!card) return;
            const index = parseInt(card.dataset.index, 10);
            if (isNaN(index)) return;

            if (e.target.dataset.action === 'delete' || e.target.closest('.snippet-card-delete')) {
                e.stopPropagation();
                openConfirm('删除片段', `确定要删除片段"${snippets[index].title}"吗？此操作不可恢复。`, () => deleteSnippet(index));
                return;
            }
            openConfirm('加载片段', `确定要加载片段"${snippets[index].title}"吗？当前编辑器的内容将被覆盖。`, () => loadSnippetToEditor(index));
        });

        btnSaveSnippet.addEventListener('click', () => {
            if (getCode().trim().length === 0) {
                showToast('当前代码为空，无法保存', '');
                return;
            }
            openSaveModal();
        });

        btnConfirmSave.addEventListener('click', () => {
            const title = snippetTitleInput.value.trim();
            if (!title) {
                snippetTitleInput.classList.add('error');
                saveError.classList.add('visible');
                snippetTitleInput.focus();
                return;
            }
            saveNewSnippet(title, getCode());
            closeSaveModal();
        });

        btnCancelSave.addEventListener('click', closeSaveModal);
        saveModal.addEventListener('click', (e) => { if (e.target === saveModal) closeSaveModal(); });

        snippetTitleInput.addEventListener('input', () => {
            snippetTitleInput.classList.remove('error');
            saveError.classList.remove('visible');
        });
        snippetTitleInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') btnConfirmSave.click();
            if (e.key === 'Escape') closeSaveModal();
        });

        btnConfirmAction.addEventListener('click', () => {
            if (confirmCallback) confirmCallback();
            closeConfirm();
        });
        btnCancelConfirm.addEventListener('click', closeConfirm);
        confirmModal.addEventListener('click', (e) => { if (e.target === confirmModal) closeConfirm(); });

        document.querySelectorAll('.panel-toggle').forEach(btn => {
            btn.addEventListener('click', () => togglePanel(btn));
        });

        // 侧栏关闭按钮
        btnCloseSnippets.addEventListener('click', () => {
            const btn = document.getElementById('btnToggleSidebar');
            if (btn) btn.click();
        });

        document.querySelector('.main-content').addEventListener('click', () => {
            if (window.matchMedia('(max-width: 768px)').matches && snippetsPanel.classList.contains('mobile-open')) {
                snippetsPanel.classList.remove('mobile-open');
            }
        });
    }

    // ==================== 事件绑定 ====================
    editor.on('change', () => {
        updatePreview();
        showStatus('等待更新...', 'syncing');
        // 用户手动编辑 → 重置格式化撤销状态
        if (formatLastFormatted !== null) {
            formatLastOriginal = null;
            formatLastFormatted = null;
            btnFormat.innerHTML = '<svg class="btn-icon"><use href="#icon-format"/></svg> 格式化';
        }
        if (debounceTimer) clearTimeout(debounceTimer);
        debounceTimer = setTimeout(() => {
            showStatus('预览已更新', 'ready');
            setTimeout(hideStatus, 2000);
        }, DEBOUNCE_DELAY);
        // 防抖保存代码到 localStorage
        if (saveTimer) clearTimeout(saveTimer);
        saveTimer = setTimeout(() => saveEditorCode(), SAVE_DELAY);
    });

    btnClear.addEventListener('click', clearCode);
    btnCopy.addEventListener('click', copyCode);
    btnFormat.addEventListener('click', formatCode);
    btnRefresh.addEventListener('click', () => {
        updatePreview();
        showStatus('预览已刷新', 'ready');
        setTimeout(hideStatus, 1500);
    });
    btnDownload.addEventListener('click', downloadHTML);

    // 全屏预览按钮
    const btnFullscreen = document.getElementById('btnFullscreen');
    const fullscreenIcon = btnFullscreen.querySelector('.btn-icon use');

    function isPreviewFullscreen() {
        return document.fullscreenElement === previewPanel ||
               document.webkitFullscreenElement === previewPanel;
    }

    function togglePreviewFullscreen() {
        if (isPreviewFullscreen()) {
            if (document.exitFullscreen) {
                document.exitFullscreen();
            } else if (document.webkitExitFullscreen) {
                document.webkitExitFullscreen();
            }
        } else {
            if (previewPanel.requestFullscreen) {
                previewPanel.requestFullscreen();
            } else if (previewPanel.webkitRequestFullscreen) {
                previewPanel.webkitRequestFullscreen();
            }
        }
    }

    function updateFullscreenIcon() {
        if (isPreviewFullscreen()) {
            fullscreenIcon.setAttribute('href', '#icon-minimize');
            btnFullscreen.setAttribute('title', '退出全屏');
            btnFullscreen.setAttribute('aria-label', '退出全屏');
        } else {
            fullscreenIcon.setAttribute('href', '#icon-maximize');
            btnFullscreen.setAttribute('title', '全屏预览');
            btnFullscreen.setAttribute('aria-label', '全屏预览');
        }
    }

    btnFullscreen.addEventListener('click', togglePreviewFullscreen);
    document.addEventListener('fullscreenchange', updateFullscreenIcon);
    document.addEventListener('webkitfullscreenchange', updateFullscreenIcon);

    document.addEventListener('keydown', (e) => {
        if ((e.ctrlKey || e.metaKey) && e.key === 's') {
            e.preventDefault();
            downloadHTML();
        }
        if ((e.ctrlKey || e.metaKey) && e.shiftKey && e.key === 'f') {
            e.preventDefault();
            formatCode();
        }
        if ((e.ctrlKey || e.metaKey) && e.shiftKey && e.key === 'C') {
            e.preventDefault();
            copyCode();
        }
    });

    init();

    // 页面关闭/刷新时立即保存代码和面板状态
    window.addEventListener('beforeunload', () => {
        saveEditorCode();
        const states = {
            side: !workspace.classList.contains('side-hidden'),
            editor: !workspace.classList.contains('editor-hidden'),
            preview: !workspace.classList.contains('preview-hidden')
        };
        savePanelStates(states);
    });
    window.addEventListener('pagehide', () => {
        saveEditorCode();
        const states = {
            side: !workspace.classList.contains('side-hidden'),
            editor: !workspace.classList.contains('editor-hidden'),
            preview: !workspace.classList.contains('preview-hidden')
        };
        savePanelStates(states);
    });

    console.log('实时预览编辑器 v3（AI + 深浅色切换 + 双分隔条）已就绪');
})();

</script>
</body>
</html>
